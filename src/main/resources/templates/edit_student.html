<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Update Student</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
    crossorigin="anonymous">
  <style>
    body {
      background-color: #f0f2f5;
      padding-top: 70px;
    }

    .card {
      margin-top: 40px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }

    .card .form-control {
      border-radius: 6px;
    }

    .card h2 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .btn-primary {
      min-width: 120px;
      font-weight: 500;
    }

    .navbar-brand {
      font-weight: bold;
    }

    label {
      font-weight: 500;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-md bg-dark navbar-dark fixed-top">
    <!-- Brand -->
    <a class="navbar-brand" href="#">Student Management System</a>

    <!-- Toggler/collapsible Button -->
    <button class="navbar-toggler" type="button" data-toggle="collapse"
      data-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar links -->
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/students}">Student Management</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card">
          <h2 class="text-center">Update Student</h2>
          <div class="card-body">
            <form th:action="@{/students/edit/{id}(id=${student.id})}" th:object="${student}" method="post">
              <div class="form-group">
                <label>Student First Name</label>
                <input type="text" name="firstName" class="form-control" th:field="*{firstName}" placeholder="Enter Student First Name">
              </div>
              <div class="form-group">
                <label>Student Last Name</label>
                <input type="text" name="lastName" class="form-control" th:field="*{lastName}" placeholder="Enter Student Last Name">
              </div>
              <div class="form-group">
                <label>Student Email</label>
                <input type="text" name="email" class="form-control" th:field="*{email}" placeholder="Enter Student Email">
              </div>
              <div class="text-center">
                <button type="submit" class="btn btn-primary">Submit</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
